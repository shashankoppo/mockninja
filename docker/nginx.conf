server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Service worker must not be cached
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
  }

  # Hashed assets — immutable caching
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Static images — long cache
  location /images/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # robots.txt and sitemap.xml — short cache
  location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache index.html so new deploys are picked up immediately
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
